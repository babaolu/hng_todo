<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · Todo</title>
		<style>
			:root {
				color-scheme: light dark;
				--canvas: #fafaf9;
				--ink: #1c1917;
				--muted: #78716c;
				--accent: #2563eb;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--canvas: #111113;
					--ink: #e7e5e4;
					--muted: #a1a1aa;
					--accent: #60a5fa;
				}
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1rem;
				background: var(--canvas);
				color: var(--ink);
				font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				text-align: center;
			}
			a {
				color: var(--accent);
			}
			p {
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline. This app needs a connection.</h1>
			<p><a href="/">Try again</a></p>
		</main>
	</body>
</html>
